name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # Same tool and baseline as .pre-commit-config.yaml, so CI catches
    # anything committed without the local hook installed.
    - name: Scan tracked files
      run: |  # pragma: allowlist secret (false positive on ".secrets.baseline")
        pip install detect-secrets==1.5.0
        git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
